<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Friday Savings Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #19918e 0%, #04383f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-family: 'Lora', serif;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 300px;
            height: auto;
        }

        .subtitle {
            text-align: center;
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: #19918e;
        }

        select:focus {
            outline: none;
            border-color: #19918e;
            background-color: white;
        }

        .results {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #19918e 0%, #04383f 100%);
            border-radius: 15px;
            color: white;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .result-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 16px;
            font-weight: 500;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
        }

        .savings-highlight {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .savings-highlight .result-label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .savings-highlight .result-value {
            font-size: 32px;
            color: #ffd700;
        }

        .annual-savings {
            background: rgba(255, 215, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        .annual-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .annual-value {
            font-size: 26px;
            font-weight: bold;
            color: #ffd700;
        }

        @media (max-width: 480px) {
            .calculator-container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 16px;
            }

            .result-value {
                font-size: 20px;
            }

            .savings-highlight .result-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="logo">
            <img src="https://8630368.fs1.hubspotusercontent-na1.net/hubfs/8630368/Nurse%20Academy.png" alt="Nurses & Midwives Academy">
        </div>
        <h1>Black Friday Savings Calculator</h1>
        <div class="subtitle">Save 60% on Nurse Academy Membership</div>
        
        <form id="calculatorForm">
            <div class="form-group">
                <label for="state">Select Your State</label>
                <select id="state" required>
                    <option value="">-- Choose State --</option>
                    <option value="QLDNT">QLD / NT</option>
                    <option value="NSWACT">NSW / ACT</option>
                    <option value="VICTAS">VIC / TAS</option>
                    <option value="SA">SA</option>
                    <option value="WA">WA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="employment">Employment Status</label>
                <select id="employment" required>
                    <option value="">-- Choose Status --</option>
                    <option value="fulltime">Full Time</option>
                    <option value="parttime">Part Time</option>
                </select>
            </div>

            <div class="form-group">
                <label for="frequency">Payment Frequency</label>
                <select id="frequency" required>
                    <option value="">-- Choose Frequency --</option>
                    <option value="annual">Annual</option>
                    <option value="monthly">Monthly</option>
                    <option value="fortnightly">Fortnightly</option>
                </select>
            </div>
        </form>

        <div id="results" class="results">
            <div class="result-row">
                <span class="result-label">Regular Price:</span>
                <span class="result-value" id="regularPrice">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Black Friday Price:</span>
                <span class="result-value" id="blackFridayPrice">$0.00</span>
            </div>
            <div class="savings-highlight">
                <div class="result-label">YOU SAVE</div>
                <div class="result-value" id="savings">$0.00</div>
            </div>
            <div id="annualSavings" class="annual-savings" style="display: none;">
                <div class="annual-label">Annual Savings:</div>
                <div class="annual-value" id="annualSavingsAmount">$0.00</div>
            </div>
        </div>
    </div>

    <script>
        const prices = {
            QLDNT: {
                fulltime: { annual: 110, monthly: 10, fortnightly: 5 },
                parttime: { annual: 110, monthly: 10, fortnightly: 5 }
            },
            NSWACT: {
                fulltime: { annual: 110, monthly: 10, fortnightly: 5 },
                parttime: { annual: 110, monthly: 10, fortnightly: 5 }
            },
            VICTAS: {
                fulltime: { annual: 55, monthly: 5, fortnightly: 2.50 },
                parttime: { annual: 55, monthly: 5, fortnightly: 2.50 }
            },
            SA: {
                fulltime: { annual: 110, monthly: 10, fortnightly: 5.62 },
                parttime: { annual: 110, monthly: 10, fortnightly: 4.62 }
            },
            WA: {
                fulltime: { annual: 27.50, monthly: 2.50, fortnightly: 1.25 },
                parttime: { annual: 55, monthly: 5, fortnightly: 2.50 }
            }
        };

        const stateSelect = document.getElementById('state');
        const employmentSelect = document.getElementById('employment');
        const frequencySelect = document.getElementById('frequency');
        const resultsDiv = document.getElementById('results');
        const annualSavingsDiv = document.getElementById('annualSavings');

        [stateSelect, employmentSelect, frequencySelect].forEach(select => {
            select.addEventListener('change', calculateSavings);
        });

        function calculateSavings() {
            const state = stateSelect.value;
            const employment = employmentSelect.value;
            const frequency = frequencySelect.value;

            if (!state || !employment || !frequency) {
                resultsDiv.classList.remove('show');
                return;
            }

            const regularPrice = prices[state][employment][frequency];
            const blackFridayPrice = regularPrice * 0.4;
            const savingsAmount = regularPrice * 0.6;

            document.getElementById('regularPrice').textContent = `$${regularPrice.toFixed(2)}`;
            document.getElementById('blackFridayPrice').textContent = `$${blackFridayPrice.toFixed(2)}`;
            document.getElementById('savings').textContent = `$${savingsAmount.toFixed(2)}`;

            // Calculate and show annual savings for fortnightly/monthly
            if (frequency === 'fortnightly') {
                const annualSavings = savingsAmount * 26; // 26 fortnights in a year
                document.getElementById('annualSavingsAmount').textContent = `$${annualSavings.toFixed(2)}`;
                annualSavingsDiv.style.display = 'block';
            } else if (frequency === 'monthly') {
                const annualSavings = savingsAmount * 12; // 12 months in a year
                document.getElementById('annualSavingsAmount').textContent = `$${annualSavings.toFixed(2)}`;
                annualSavingsDiv.style.display = 'block';
            } else {
                annualSavingsDiv.style.display = 'none';
            }

            resultsDiv.classList.add('show');
        }
    </script>
</body>
</html>
